<!doctype html>
<html lang="zh-CN">
  <head>
    <!--
设计定调：Refined Command Console（安全指挥台）。
统一配色：深墨底 + 分层表面形成层次感；单一酸柠主强调 --accent，次强调 --accent-2（青，命中/正向）；
语义色仅用于拦截/越界。导航统一为「静止 muted → 悬停/当前 accent」，不再使用彩虹五色。
跨页过渡：.pt 圆形揭幕（JS 驱动，降级走原生跳转）；按钮涟漪 data-ripple。
离线零依赖、零外部请求：展示字用压缩字栈回退，不引入任何 webfont / CDN。
主页参照 www.soul.io 落地页的视觉语言（纯黑基底、压缩展示字 Hero、conic 光环、autoloop、SoundBlock 长按换肤），
功能页参照 app.soul.io（编号导航、数据卡、ScrambleText）。两页共享同一套 token 与同一套过渡/按钮动效。
-->
    <title>SmartWAF-Breaker · 智能自适应绕过系统</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="SmartWAF-Breaker 智能自适应绕过系统演示主页：面向授权目标的已知漏洞类型探测辅助工具，WAF 环境下的闭环反馈、逐轮自适应与过程可解释。全部为演示数据，仅用于本地隔离靶场，不发起任何真实请求。"
    />
    <meta name="theme-color" content="#0a0c0f" />
    <meta
      property="og:title"
      content="SmartWAF-Breaker · 智能自适应绕过系统"
    />
    <meta
      property="og:description"
      content="授权自测演示主页：逐轮自适应探测、证据链留痕、过程可解释。演示数据，零外部请求。"
    />
    <!-- 目标页首帧覆盖，避免跳转闪烁 -->
    <script>
      try {
        if (sessionStorage.getItem("pt-nav") === "1")
          document.documentElement.classList.add("pt-cover");
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/core.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>

    <div class="wrap">
      <header class="site-head">
        <a class="brand" href="index.html"><i></i>PROBE / LAB</a>

          <a class="nav-item" href="#chains">CHAINS</a>
          <a class="nav-item" href="#brands">STACK</a>

        <a
          class="btn btn--primary btn--sm"
          href="console.html"
          data-nav
          data-ripple

          进入控制台 <span aria-hidden="true">→</span>

      <main>
        <!-- ② Hero -->
        <section class="hero" id="hero">
          <div class="hero-left">
            <p class="eyebrow muted">授权自测工具 / 本地隔离靶场 / DEMO 数据</p>
            <h1>
              <span class="line line--brand" style="--i: 0"
                >SmartWAF-Breaker</span
              >
              <span class="line line--cn" style="--i: 1"
                >智能自适应绕过系统</span
              >
            </h1>
            <p class="sub">
              在 WAF 防护下，让已知漏洞仍可被验证。<br />以响应为反馈，逐轮收敛，过程可解释。
            </p>
            <div class="hero-actions">
              <a
                class="btn btn--primary"
                href="console.html"
                data-nav
                data-ripple
              >
                进入控制台 <span aria-hidden="true">→</span>
              </a>
              <span class="demo-tag">DEMO DATA / 非实时推理</span>
            </div>
            <div class="status-strip">
              <span class="dots"><i></i><i></i><i></i></span>
              <span class="ping" aria-hidden="true"></span>
              <span>本地离线 · 零外部请求</span>
              <span>不涉及未知漏洞挖掘</span>
            </div>
          </div>
          <div class="hero-right" id="heroRight">
            <div class="halo" id="halo" aria-hidden="true"></div>
            <div class="halo-core" aria-hidden="true">
              <b>03</b><span>SCENARIOS / 演示剧本</span>
            </div>
            <div class="stages" id="motion" aria-hidden="true">
              <span class="stage" style="--i: 0"
                ><i></i><b>采集</b><em>ROUND</em></span
              >
              <span class="stage" style="--i: 1"
                ><i></i><b>推理</b><em>SIGNAL</em></span
              >
              <span class="stage" style="--i: 2"
                ><i></i><b>发包</b><em>DECISION</em></span
              >
              <span class="stage" style="--i: 3"
                ><i></i><b>判定</b><em>VERDICT</em></span
              >
              <span class="stage" style="--i: 4"
                ><i></i><b>反馈</b><em>FEEDBACK</em></span
              >
              <span class="stage-dots"><i></i><i></i><i></i></span>
            </div>
          </div>
        </section>
