<!doctype html>
<!--
  index.html — 洞鉴展示大屏（任务提交 + 六阶段流水线 + 实时日志）

  职责：提供唯一入口——输入授权靶场网址、一键执行、订阅 SSE 进度、六阶段动画。
  设计：见 css/app.css 顶部的设计方向；签名元素是双轨形状标记（◆ 假设 / ■ 裁决）。
  数据流：POST /api/scan 拿 task_id → EventSource(/api/progress?id=) 推进度 → 完成后跳报告页。
  零外联：所有请求只发往同源 API；无 CDN、无 webfont、无外部脚本。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洞鉴 · 漏洞验真台</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="brand">
        <span class="brand__name">洞鉴</span>
        <span class="brand__sub">AI-VERIFIED / LAB</span>
      </div>
      <nav class="topnav">
        <a href="index.html" class="is-active">验真台</a>
        <a href="report.html">证据链报告</a>
      </nav>
    </header>

    <!-- 任务提交 -->
    <section class="submit">
      <div class="submit__head">
        <h1 class="submit__title">授权靶场验真</h1>
        <span class="submit__note">AI 只提假设，机器实测裁决</span>
      </div>
      <div class="submit__row">
        <div class="field">
          <label class="field__label" for="target">靶场地址</label>
          <input id="target" class="field__input" type="text" value="http://192.168.109.129/shop_labs"
                 placeholder="http://192.168.109.129/shop_labs" autocomplete="off">
        </div>
        <div class="field field--auth">
          <label class="field__label" for="authId">授权编号</label>
          <input id="authId" class="field__input" type="text" value="AUTH-LAB-2026-001">
        </div>
        <label class="checkbox">
          <input id="authChk" type="checkbox" checked>
          已获书面授权
        </label>
        <button id="startBtn" class="btn">开始验真</button>
      </div>
      <div id="msg" class="msg">仅对授权范围内的内网靶场执行，公网目标默认拒绝</div>
    </section>

    <!-- 六阶段流水线 -->
    <section class="pipeline">
      <div class="pipeline__head">
        <h2 class="pipeline__title">流水线状态</h2>
        <span id="stateText" class="pipeline__state">待启动</span>
      </div>
      <div id="stages" class="stages"></div>
      <div class="progress">
        <div class="progress__bar"><div id="progressFill" class="progress__fill"></div></div>
        <span id="progressNum" class="progress__num">0%</span>
      </div>
    </section>

    <!-- 实时日志 -->
    <section class="logbook">
      <div class="logbook__head">
        <h2 class="logbook__title">执行日志</h2>
        <span id="logCount" class="logbook__count">0 行</span>
      </div>
      <div id="logBody" class="logbook__body">
        <div class="logbook__empty">任务启动后，这里逐行显示各阶段输出</div>
      </div>
    </section>

    <footer class="footer">
      <span>洞鉴 · 漏洞结论验真平台</span>
      <span>证据说了算 · 全部数据取自靶机真实响应</span>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
