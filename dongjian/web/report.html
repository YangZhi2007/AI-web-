<!doctype html>
<!--
  report.html — 洞鉴证据链报告页

  职责：按 task_id 读取报告对象，渲染三件套——假设原文 / 验证证据 / 处置建议。
  设计：双轨对照是核心 moment：左轨 ◆ AI 假设，右轨 ■ 机器裁决，中间发丝线分隔。
  数据来源：GET /api/report?id=<task_id>；无报告时显示空态而非报错。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>洞鉴 · 证据链报告</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand__name">洞鉴</span>
        <span class="brand__sub">AI-VERIFIED / LAB</span>
      </div>
      <nav class="topnav">
        <a href="index.html">验真台</a>
        <a href="report.html" class="is-active">证据链报告</a>
      </nav>
    </header>

    <!-- 报告摘要 -->
    <div id="reportMeta" class="report-meta"></div>

    <!-- 发现列表：双轨对照 -->
    <div id="findings"></div>

    <footer class="footer">
      <span>洞鉴 · 漏洞结论验真平台</span>
      <span>AI 未下结论 · 结论由靶机真实响应产生</span>
    </footer>
  </div>

  <script src="js/api.js"></script>
  <script src="js/report.js"></script>
</body>
</html>
